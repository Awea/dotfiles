experimental-features = nix-command flakes
keep-outputs = true
keep-derivations = true
# os.conf links to linux.conf or macos.conf (make links): the settings of this OS
# only. nix.conf has no per-platform condition. The nix-daemon applies them,
# because the user is in trusted-users in /etc/nix/nix.conf.
!include os.conf
