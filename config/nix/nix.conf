experimental-features = nix-command flakes
keep-outputs = true
keep-derivations = true
# No auto-optimise-store: this file is shared with macOS, where it makes builds
# fail with "cannot link ... File exists" (NixOS/nix#7273), and nix.conf has no
# per-platform condition. bin.symlink/prune-disk runs `nix-store --optimise`
# instead, which gives the same hard-link savings outside of builds.
