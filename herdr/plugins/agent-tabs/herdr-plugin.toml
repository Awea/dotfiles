id = "awea.agent-tabs"
name = "Agent tabs"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Open claude in a new tab, clean or from a /handoff document"
platforms = ["linux", "macos"]

[[actions]]
id = "new-tab"
title = "agent-tabs: new claude tab"
contexts = ["pane", "workspace"]
command = ["bash", "new-agent-tab.sh", "open"]

[[actions]]
id = "handoff"
title = "agent-tabs: handoff to new tab"
contexts = ["pane"]
command = ["bash", "handoff.sh", "open"]

[[actions]]
id = "new-shell-tab"
title = "agent-tabs: new tab in the main worktree"
contexts = ["pane", "workspace"]
command = ["bash", "new-shell-tab.sh"]

[[actions]]
id = "focus-link"
title = "agent-tabs: focus a Herdr link"
contexts = ["pane"]
command = ["bash", "focus-link.sh"]

[[link_handlers]]
id = "herdr-link"
title = "Focus the Herdr pane or tab"
pattern = "^https://herdr\\.invalid/(pane|tab)/[A-Za-z0-9]+:[A-Za-z0-9]+$"
action = "focus-link"

[[panes]]
id = "new-tab-prompt"
title = "New claude"
placement = "popup"
width = "60%"
height = 7
command = ["bash", "new-agent-tab.sh", "prompt"]

[[panes]]
id = "handoff-prompt"
title = "Handoff"
placement = "popup"
width = "60%"
height = 7
command = ["bash", "handoff.sh", "prompt"]
